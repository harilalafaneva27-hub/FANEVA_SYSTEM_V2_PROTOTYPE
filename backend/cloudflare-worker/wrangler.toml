name = "faneva-v2-staging-api"
main = "src/index.ts"
compatibility_date = "2026-11-18"

[vars]
FANEVA_ENVIRONMENT = "staging"

# Bind only a separately-created V2 STAGING D1 database after account ownership
# and database ID are independently verified. No production database binding.
[[d1_databases]]
binding = "DB"
database_name = "faneva-v2-staging-db"
database_id = "REPLACE_WITH_VERIFIED_STAGING_DATABASE_ID"
migrations_dir = "migrations"
