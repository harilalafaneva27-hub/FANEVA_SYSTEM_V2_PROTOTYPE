name: FANEVA V2 Cloudflare Worker Security Tests

on:
  push:
    branches:
      - feature/owner-device-approval-audit-chain-20261125
  pull_request:
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-security-tests.yml"
      - ".github/workflows/argon2id-single-request-smoke.yml"
      - ".github/workflows/staging-d1-apply-migrations.yml"
      - ".github/workflows/staging-d1-backup.yml"
      - ".github/workflows/staging-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: faneva-worker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate protected staging workflow YAML and shell scripts
        shell: bash
        run: |
          ruby - ../../.github/workflows/staging-d1-apply-migrations.yml ../../.github/workflows/staging-d1-backup.yml ../../.github/workflows/staging-worker-deploy.yml ../../.github/workflows/argon2id-single-request-smoke.yml <<'RUBY'
          require "yaml"
          require "open3"
          ARGV.each do |file|
            workflow = YAML.load_file(file)
            workflow.fetch("jobs").each do |job_name, job|
              job.fetch("steps", []).each_with_index do |step, index|
                next unless step["run"]
                _out, err, status = Open3.capture3("bash", "-n", stdin_data: step["run"])
                abort "#{file} / #{job_name} / step #{index + 1}: #{err}" unless status.success?
              end
            end
          end
          RUBY
        env:
          VALIDATE_WORKFLOWS: "staging-d1-apply-migrations.yml staging-worker-deploy.yml"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CI validate pinned Argon2id package and WASM assets
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/argon2id-package-validation"
          mkdir -p "$package_root"
          npm install --prefix "$package_root" --no-save --package-lock=false argon2id@1.0.1
          package_dir="$package_root/node_modules/argon2id"
          test -s "$package_dir/package.json"
          test -s "$package_dir/lib/setup.js"
          test -s "$package_dir/dist/simd.wasm"
          test -s "$package_dir/dist/no-simd.wasm"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const root = process.argv[1];
            for (const file of ["dist/simd.wasm", "dist/no-simd.wasm"]) {
              const magic = readFileSync(root + "/" + file).subarray(0, 4);
              if (!magic.equals(Buffer.from([0, 97, 115, 109]))) throw new Error("Invalid WASM header: " + file);
            }
            console.log("argon2id@1.0.1 loader and both WASM modules verified");
          ' "$package_dir"
          ARGON2ID_PACKAGE_ROOT="$package_dir" node scripts/argon2id-kat-offline.mjs
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify expected KAT digest with independent libargon2 reference
        run: |
          python -m pip install --disable-pip-version-check --no-input argon2-cffi==25.1.0
          python scripts/argon2id-kat-reference.py
      - name: Install Worker dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Worker unit and integration tests
        run: npm test
      - name: D1 migration tests
        run: python scripts/test-migrations.py
      - name: Business migration regression tests
        run: |
          python scripts/test_business_migration.py
          python scripts/test_atomic_sale_rollback.py
          python scripts/test_atomic_transfer_debt.py
          python scripts/test_sync_pull_contract.py
