name: FANEVA V2 Android Keystore Instrumentation

on:
  workflow_dispatch:
  push:
    branches:
      - test/android-keystore-instrumentation

permissions:
  contents: read

concurrency:
  group: faneva-v2-keystore-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keystore-instrumentation:
    name: Android Keystore instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile app and instrumentation test APKs
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run Android Keystore tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
