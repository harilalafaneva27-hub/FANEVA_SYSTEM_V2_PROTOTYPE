name: FANEVA V2 Android Keystore Instrumentation

on:
  workflow_dispatch:
  push:
    branches:
      - test/android-keystore-instrumentation

permissions:
  contents: read

concurrency:
  group: faneva-v2-keystore-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keystore-instrumentation:
    name: Android Keystore instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Keystore tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest

