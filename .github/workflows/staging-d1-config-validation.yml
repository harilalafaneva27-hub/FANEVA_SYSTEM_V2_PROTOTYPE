name: FANEVA V2 Staging D1 Config Validation

on:
  pull_request:
    branches:
      - fix/android-mga-integer-auth-contract
      - fix/staging-d1-database-name-alignment
    paths:
      - "backend/cloudflare-worker/wrangler.toml"
      - "backend/cloudflare-worker/scripts/staging-d1-smoke.sh"
      - "backend/cloudflare-worker/scripts/staging-d1-readonly-preflight.sh"
      - "backend/cloudflare-worker/scripts/live-worker-d1.integration.mjs"
      - ".github/workflows/staging-d1-integration.yml"
      - ".github/workflows/staging-d1-config-validation.yml"
  push:
    branches:
      - fix/staging-d1-database-name-alignment
      - fix/staging-d1-integration-db-name
      - fix/staging-d1-readonly-preflight
    paths:
      - "backend/cloudflare-worker/wrangler.toml"
      - "backend/cloudflare-worker/scripts/staging-d1-smoke.sh"
      - "backend/cloudflare-worker/scripts/staging-d1-readonly-preflight.sh"
      - "backend/cloudflare-worker/scripts/live-worker-d1.integration.mjs"
      - ".github/workflows/staging-d1-integration.yml"
      - ".github/workflows/staging-d1-config-validation.yml"

permissions:
  contents: read

jobs:
  validate-staging-d1-config:
    name: Validate staging D1 config without Cloudflare access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate script syntax
        working-directory: backend/cloudflare-worker
        run: |
          bash -n scripts/staging-d1-smoke.sh
          bash -n scripts/staging-d1-readonly-preflight.sh
          node --check scripts/live-worker-d1.integration.mjs

      - name: Validate Wrangler D1 identity and smoke targets
        working-directory: backend/cloudflare-worker
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          config_path = pathlib.Path("wrangler.toml")
          smoke_path = pathlib.Path("scripts/staging-d1-smoke.sh")
          preflight_path = pathlib.Path("scripts/staging-d1-readonly-preflight.sh")
          integration_path = pathlib.Path("scripts/live-worker-d1.integration.mjs")
          workflow_path = pathlib.Path("../../.github/workflows/staging-d1-integration.yml")

          config = tomllib.loads(config_path.read_text())
          smoke = smoke_path.read_text()
          preflight = preflight_path.read_text()
          integration = integration_path.read_text()
          workflow = workflow_path.read_text()

          expected_name = "faneva-v2-staging-db"
          expected_binding = "DB"
          expected_placeholder = "REPLACE_WITH_VERIFIED_STAGING_DATABASE_ID"

          databases = config.get("d1_databases", [])
          assert len(databases) == 1, f"Expected exactly one D1 binding, found {len(databases)}"
          database = databases[0]
          assert database.get("binding") == expected_binding, "Unexpected D1 binding"
          assert database.get("database_name") == expected_name, "Wrangler D1 database_name mismatch"
          assert database.get("database_id") == expected_placeholder, "Expected unresolved D1 ID placeholder to remain"

          assert "bash scripts/staging-d1-readonly-preflight.sh" in smoke, "Live D1 writes must be preceded by read-only identity preflight"
          assert "api.cloudflare.com/client/v4" in preflight, "Preflight must use the Cloudflare API"
          assert "/accounts/$CLOUDFLARE_ACCOUNT_ID" in preflight, "Preflight must verify the protected account"
          assert "/d1/database/$FANEVA_V2_STAGING_D1_ID" in preflight, "Preflight must verify the exact D1 ID"
          assert ".result.uuid == $id and .result.name == $name" in preflight, "Preflight must verify exact D1 ID and name"
          assert "wrangler@4" not in preflight and "d1 execute" not in preflight and "d1 migrations apply" not in preflight, "Read-only preflight must not invoke D1 write commands"
          assert "environment: faneva-v2-staging" in pathlib.Path("../../.github/workflows/staging-d1-readonly-preflight.yml").read_text(), "Read-only preflight must use protected staging environment"
          assert expected_name in smoke, "Smoke script does not target the verified D1 database name"
          assert smoke.count("wrangler@4 d1 ") >= 3, "Expected migration, execute, and cleanup D1 command paths"
          assert "d1 migrations apply " + expected_name + " --remote" in smoke, "Remote migration target mismatch"
          assert "d1 execute " + expected_name + " --remote" in smoke, "Remote execute/cleanup target mismatch"
          insert_position = smoke.index("INSERT INTO device_registry")
          trap_position = smoke.index("trap cleanup EXIT")
          assert trap_position < insert_position, "Cleanup trap must be installed before the remote device INSERT"
          assert "CREATED" not in smoke, "Cleanup must not depend on a post-INSERT success flag"
          assert "Always attempt deletion" in smoke, "Unconditional cleanup rationale missing"
          assert "cleanup_status=1" in smoke, "Cleanup failure must fail an otherwise successful smoke run"
          assert 'echo "LIVE_STAGING_D1_CLEANUP=PASS"' in smoke, "Cleanup PASS must be emitted only after successful deletion"
          nonce_delete = smoke.index("DELETE FROM request_nonces")
          device_delete = smoke.index("DELETE FROM device_registry")
          assert nonce_delete < device_delete, "Cleanup must delete nonce rows before the device row"


          assert f'const d1Name = "{expected_name}";' in integration, "Integration test D1 name mismatch"
          assert '"d1", "execute", d1Name' in integration, "Integration test does not use the validated D1 name"
          assert "DELETE FROM request_nonces" in integration and "DELETE FROM device_registry" in integration, "Integration cleanup statements missing"
          assert "  } finally {" in integration, "Integration cleanup must run from a finally block"
          assert "Always clean up this test's unique device ID" in integration, "Unconditional test-device cleanup rationale missing"
          assert "if (enrolled)" not in integration and "let enrolled =" not in integration, "Cleanup must not depend on receiving the enrollment success response"

          assert "environment: faneva-v2-staging" in workflow, "Live smoke environment protection missing"
          assert "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_LIVE_STAGING_D1_SMOKE]')" in workflow, "Live smoke gate missing"

          print("READONLY_PREFLIGHT_ACCOUNT_AND_D1_IDENTITY=PASS")
          print("LIVE_SMOKE_REQUIRES_READONLY_PREFLIGHT=PASS")
          print("WRANGLER_D1_NAME=PASS")
          print("WRANGLER_D1_BINDING=PASS")
          print("D1_ID_PLACEHOLDER_PRESERVED=PASS")
          print("SMOKE_MIGRATION_EXECUTE_TARGETS=PASS")
          print("SMOKE_UNCONDITIONAL_CLEANUP_AND_FAILURE_PROPAGATION=PASS")
          print("INTEGRATION_TEST_D1_NAME_AND_CLEANUP=PASS")
          print("LIVE_SMOKE_ENVIRONMENT_AND_GATE=PASS")
          PY
