name: FANEVA V2 Live Staging D1 Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faneva-v2-live-staging-d1
  cancel-in-progress: false

jobs:
  staging-d1-smoke:
    if: github.ref == 'refs/heads/fix/staging-d1-database-name-alignment'
    name: Apply staging schema and verify D1 constraints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: faneva-v2-staging
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.FANEVA_V2_STAGING_ACCOUNT_ID }}
      FANEVA_V2_STAGING_D1_ID: ${{ vars.FANEVA_V2_STAGING_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify protected staging configuration is present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FANEVA_V2_STAGING_D1_ID"
          echo "Protected staging configuration present; values are not printed."
      - name: Apply D1 migrations and run live schema/nonce test
        run: bash scripts/staging-d1-smoke.sh
