name: FANEVA V2 Staging Pre-deployment Gate

on:
  push:
    branches:
      - backend/staging-device-signature
    paths:
      - "app/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faneva-staging-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-typecheck-and-integration:
    name: Worker typecheck + crypto + D1 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Cryptographic and Worker integration tests
        run: npm test

  android-unit-tests:
    name: Android unit and Room regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-36.1" \
                     "build-tools;36.0.0"
      - name: Run Android unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

  staging-predeployment-gate:
    name: Staging deployment prerequisites
    runs-on: ubuntu-latest
    needs:
      - worker-typecheck-and-integration
      - android-unit-tests
    steps:
      - name: Confirm all required CI gates passed
        run: |
          echo "WORKER_TYPECHECK=PASS"
          echo "WORKER_CRYPTO_AND_INTEGRATION_TESTS=PASS"
          echo "ANDROID_UNIT_AND_ROOM_TESTS=PASS"
          echo "STAGING_DEPLOYMENT_GATE=PASS"
          echo "No deployment or Cloudflare resource mutation is performed by this workflow."
