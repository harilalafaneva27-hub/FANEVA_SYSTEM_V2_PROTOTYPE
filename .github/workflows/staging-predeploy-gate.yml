name: FANEVA V2 Staging Pre-deployment Gate

on:
  push:
    branches:
      - backend/staging-device-signature
      - implementation/owner-bootstrap-30m
      - fix/staging-sync-integration-contract
      - fix/android-mga-integer-auth-contract
      - fix/business-sync-v1-readiness
    paths:
      - "app/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faneva-staging-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-typecheck-and-integration:
    name: Worker typecheck + crypto + request-handler integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate live D1 smoke script syntax
        run: bash -n scripts/staging-d1-smoke.sh
      - name: Validate offline owner bootstrap issuer syntax
        run: node --check scripts/issue-owner-bootstrap.mjs
      - name: Validate D1 migration chain and constraints
        run: python3 scripts/test-migrations.py
      - name: Validate live Worker D1 integration script syntax
        run: node --check scripts/live-worker-d1.integration.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: D1-backed Worker business-handler integration tests
        run: npm run test:business-d1
      - name: Cryptographic and Worker integration tests
        run: npm test

  android-unit-tests:
    name: Android unit and Room regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-36.1" \
                     "build-tools;36.0.0"
      - name: Prepare temporary debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$GITHUB_WORKSPACE/debug.keystore"
      - name: Run Android unit tests and compile debug APK
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug

  android-keystore-instrumentation:
    name: Android Keystore ECDSA instrumentation test
    # Pin to the stable hosted image with supported KVM device access.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Verify and grant Android Emulator KVM access
        run: |
          echo "RUNNER_IMAGE=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          uname -a
          if [ ! -c /dev/kvm ]; then
            echo "::error::KVM character device /dev/kvm is unavailable."
            ls -la /dev | head -80
            exit 1
          fi
          ls -l /dev/kvm
          id
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "KVM_DEVICE_ACCESS=PASS"
      - name: Prepare temporary debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$GITHUB_WORKSPACE/debug.keystore"
      - name: Run Android Keystore test on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          script: ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest

  staging-predeployment-gate:
    name: Staging readiness gate (blocks until sync is complete)
    runs-on: ubuntu-latest
    needs:
      - worker-typecheck-and-integration
      - android-unit-tests
      - android-keystore-instrumentation
    steps:
      - uses: actions/checkout@v4
      - name: Confirm tested code jobs passed
        run: |
          echo "WORKER_TYPECHECK_AND_CRYPTO_TESTS=PASS"
          echo "WORKER_D1_BUSINESS_INTEGRATION_TESTS=PASS"
          echo "ANDROID_UNIT_ROOM_AND_BUILD=PASS"
          echo "ANDROID_KEYSTORE_INSTRUMENTATION=PASS"
      - name: Block staging readiness while business sync is fail-closed
        run: |
          if grep -q "SYNC_HANDLER_NOT_READY_FOR_STAGING" backend/cloudflare-worker/src/index.ts; then
            echo "::error::Staging readiness blocked: authoritative business sync handler is not implemented."
            exit 1
          fi
          echo "SYNC_HANDLER_IMPLEMENTED=PASS"
          echo "Live staging D1 smoke test remains a separate required approval-controlled workflow."
