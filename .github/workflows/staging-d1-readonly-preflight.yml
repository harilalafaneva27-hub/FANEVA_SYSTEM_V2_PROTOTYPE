name: FANEVA V2 Staging D1 Read-only Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - fix/staging-d1-readonly-preflight
    paths:
      - "backend/cloudflare-worker/scripts/staging-d1-readonly-preflight.sh"
      - "backend/cloudflare-worker/wrangler.toml"
      - ".github/workflows/staging-d1-readonly-preflight.yml"

permissions:
  contents: read

concurrency:
  group: faneva-v2-staging-d1-readonly-preflight
  cancel-in-progress: false

jobs:
  verify-staging-identity:
    name: Verify exact V2 staging account and D1 identity (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: faneva-v2-staging
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.FANEVA_V2_STAGING_ACCOUNT_ID }}
      FANEVA_V2_STAGING_D1_ID: ${{ vars.FANEVA_V2_STAGING_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only script syntax
        run: bash -n scripts/staging-d1-readonly-preflight.sh
      - name: Verify protected staging account and D1 identity
        run: bash scripts/staging-d1-readonly-preflight.sh
