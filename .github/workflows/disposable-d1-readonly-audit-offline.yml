name: FANEVA V2 Disposable D1 Read-Only Audit Offline Validation

on:
  push:
    branches:
      - feature/product-edit-delete
    paths:
      - ".github/workflows/disposable-d1-readonly-audit-offline.yml"
      - ".github/workflows/disposable-staging-d1-live.yml"
      - "backend/cloudflare-worker/scripts/audit-disposable-d1-orphan-readonly.mjs"
      - "backend/cloudflare-worker/scripts/audit-disposable-d1-orphan-readonly.test.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-d1-live-runner.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-d1-live-runner.test.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-roundtrip-harness.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-roundtrip-harness.test.mjs"
  pull_request:
    branches:
      - feature/product-edit-delete
    paths:
      - ".github/workflows/disposable-d1-readonly-audit-offline.yml"
      - ".github/workflows/disposable-staging-d1-live.yml"
      - "backend/cloudflare-worker/scripts/audit-disposable-d1-orphan-readonly.mjs"
      - "backend/cloudflare-worker/scripts/audit-disposable-d1-orphan-readonly.test.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-d1-live-runner.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-d1-live-runner.test.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-roundtrip-harness.mjs"
      - "backend/cloudflare-worker/scripts/disposable-staging-roundtrip-harness.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faneva-v2-disposable-d1-readonly-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow and audit sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout reviewed immutable round-trip runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f005348b98b893b105e589833e1b1fc829adce1c
          path: roundtrip-runner
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.21.1
      - name: Check audit script syntax
        run: node --check backend/cloudflare-worker/scripts/audit-disposable-d1-orphan-readonly.mjs
      - name: Run offline read-only audit safety tests
        run: node --test backend/cloudflare-worker/scripts/audit-disposable-d1-orphan-readonly.test.mjs
      - name: Verify round-trip runner pin and source files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C roundtrip-runner rev-parse HEAD)" = "f005348b98b893b105e589833e1b1fc829adce1c"
          test -f roundtrip-runner/backend/cloudflare-worker/scripts/disposable-staging-d1-live-runner.mjs
          test -f roundtrip-runner/backend/cloudflare-worker/scripts/disposable-staging-roundtrip-harness.mjs
      - name: Check round-trip runner and harness syntax
        working-directory: roundtrip-runner/backend/cloudflare-worker
        run: |
          node --check scripts/disposable-staging-d1-live-runner.mjs
          node --check scripts/disposable-staging-roundtrip-harness.mjs
          node --check scripts/disposable-staging-d1-live-runner.test.mjs
          node --check scripts/disposable-staging-roundtrip-harness.test.mjs
      - name: Run round-trip runner and harness offline tests
        working-directory: roundtrip-runner/backend/cloudflare-worker
        run: node --test scripts/disposable-staging-d1-live-runner.test.mjs scripts/disposable-staging-roundtrip-harness.test.mjs
