name: FANEVA V2 Disposable D1 Orphan Recovery Offline Validation

on:
  pull_request:
    branches:
      - feature/product-edit-delete
    paths:
      - ".github/workflows/disposable-d1-orphan-offline-validation.yml"
      - ".github/workflows/disposable-d1-orphan-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faneva-v2-disposable-d1-offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Checkout immutable recovery-script source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: c6eb985d79fc8dff90eb7649c470ee1e85ab6ab4
          path: recovery-source
          persist-credentials: false
      - name: Validate recovery script syntax only (no execution, no network, no D1)
        working-directory: recovery-source/backend/cloudflare-worker
        run: node --check scripts/recover-disposable-d1-orphan-fixtures.mjs
