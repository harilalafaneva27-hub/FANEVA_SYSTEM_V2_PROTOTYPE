name: FANEVA V2 Deploy Staging Worker (Protected)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_FANEVA_V2_STAGING_WORKER exactly"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: faneva-v2-staging-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Verify migrated D1, deploy staging Worker and check health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: faneva-v2-staging
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.FANEVA_V2_STAGING_ACCOUNT_ID }}
      FANEVA_V2_STAGING_D1_ID: ${{ vars.FANEVA_V2_STAGING_D1_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      # Immutable action commit pins, resolved from the official upstream tag refs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify selected source ref and commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "feature/product-edit-delete" ]] || {
            echo "Staging deployment is restricted to feature/product-edit-delete." >&2
            exit 29
          }
          checked_out_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          [[ "$checked_out_sha" == "$GITHUB_SHA" ]] || {
            echo "Checkout SHA does not match the dispatched workflow SHA." >&2
            exit 28
          }
          echo "DEPLOY_SOURCE_SHA=$checked_out_sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/cloudflare-worker/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Require explicit staging deployment confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "DEPLOY_FANEVA_V2_STAGING_WORKER" ]] || {
            echo "Explicit staging deployment confirmation did not match; stopping." >&2
            exit 30
          }
          [[ "$FANEVA_V2_STAGING_D1_ID" == "db0a27e3-898c-4116-8730-7bd1da1a1a10" ]] || {
            echo "Staging D1 UUID mismatch; stopping." >&2
            exit 31
          }
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare API token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing staging account ID}"

      - name: Install exact locked Worker dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run final offline checks
        run: |
          npm run typecheck
          npm test
          python scripts/test-migrations.py

      - name: Verify exact D1 identity and live Worker binding
        run: bash scripts/staging-d1-readonly-preflight.sh

      - name: Refuse deployment unless migrations 0001-0007 are all applied
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$api/d1/database/$FANEVA_V2_STAGING_D1_ID/query" \
            --data '{"sql":"SELECT name FROM d1_migrations ORDER BY name"}' \
            -o "$RUNNER_TEMP/migrations.json"
          jq -e '
            .success == true and .result[0].success == true and
            ([.result[0].results[].name | sub("\\.sql$"; "")] | sort) ==
            ["0001_device_registry","0002_owner_bootstrap_sessions","0003_authoritative_business_ledger","0004_auth_credential_hardening","0005_store_attributed_customer_ledger","0006_security_audit_chain","0007_auth_password_hash_iterations"]
          ' "$RUNNER_TEMP/migrations.json" >/dev/null
          echo "ALL_SEVEN_STAGING_MIGRATIONS_VERIFIED"

      - name: Require successful disposable authenticated roundtrip for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/disposable-staging-d1-live.yml/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=100"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$url" -o "$RUNNER_TEMP/disposable-roundtrip-runs.json"
          jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '
            .workflow_runs |
            any(.[]; .head_sha == $sha and .conclusion == "success" and
              .event == "workflow_dispatch" and .head_branch == $branch)
          ' "$RUNNER_TEMP/disposable-roundtrip-runs.json" >/dev/null || {
            echo "No successful disposable authenticated roundtrip exists for this exact commit; refusing deployment." >&2
            exit 32
          }
          echo "EXACT_COMMIT_DISPOSABLE_AUTHENTICATED_ROUNDTRIP=VERIFIED"

      - name: Create ephemeral Wrangler config with protected D1 ID
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'database_id = "REPLACE_WITH_VERIFIED_STAGING_DATABASE_ID"' wrangler.toml
          sed "s/REPLACE_WITH_VERIFIED_STAGING_DATABASE_ID/$FANEVA_V2_STAGING_D1_ID/" wrangler.toml > wrangler.staging.generated.toml
          grep -Fq "database_id = \"$FANEVA_V2_STAGING_D1_ID\"" wrangler.staging.generated.toml

      - name: Deploy only the pinned staging Worker
        run: npx --no-install wrangler deploy --config wrangler.staging.generated.toml

      - name: Verify staging health endpoint and D1 binding after deployment
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" -o "$RUNNER_TEMP/workers-subdomain.json"
          jq -e '.success == true and .result.enabled == true and (.result.subdomain | type == "string" and length > 0)' "$RUNNER_TEMP/workers-subdomain.json" >/dev/null
          subdomain="$(jq -r '.result.subdomain' "$RUNNER_TEMP/workers-subdomain.json")"
          worker_url="https://faneva-v2-staging-api.$subdomain.workers.dev/health"
          response="$(curl --fail --silent --show-error "$worker_url")"
          printf '%s' "$response" | jq -e '.ok == true and .service == "faneva-v2-staging" and .environment == "staging"' >/dev/null
          bash scripts/staging-d1-readonly-preflight.sh
          echo "STAGING_WORKER_HEALTH_CHECK=PASS"
          echo "STAGING_WORKER_HEALTH_URL=$worker_url"
