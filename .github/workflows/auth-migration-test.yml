name: FANEVA V2 Auth Migration Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/product-edit-delete

permissions:
  contents: read

concurrency:
  group: faneva-v2-auth-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-migration-test:
    name: Auth Migration 3 to 4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36.1" \
                     "build-tools;36.0.0"

      - name: Run Auth Migration Test only
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest \
            --tests "com.example.AuthMigrationTest" \
            --tests "com.example.RoomMigrationIntegrationTest"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faneva-auth-migration-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
