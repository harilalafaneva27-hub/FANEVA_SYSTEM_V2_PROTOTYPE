name: FANEVA V2 Isolated PBKDF2 Preview Deployment

run-name: Isolated PBKDF2 diagnostic Worker deployment (manual, gated)

on:
  pull_request:
    branches:
      - diagnostic/pbkdf2-preview-dry-run
    paths:
      - ".github/workflows/pbkdf2-preview-deployment-gated.yml"
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Deploy only faneva-v2-pbkdf2-preview-diagnostic"
        required: true
        type: choice
        options:
          - NO_DEPLOY
          - DEPLOY_PBKDF2_DIAGNOSTIC_ONLY

permissions:
  contents: read

concurrency:
  group: faneva-v2-pbkdf2-preview-deployment
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/pbkdf2-preview-deployment-gated.yml

  deploy-pbkdf2-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/pbkdf2-preview-dry-run' && inputs.confirm_deployment == 'DEPLOY_PBKDF2_DIAGNOSTIC_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate isolated PBKDF2 target and credentials
        working-directory: backend/cloudflare-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PBKDF2_DIAGNOSTIC_TOKEN: ${{ secrets.PBKDF2_DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PBKDF2_DIAGNOSTIC_TOKEN"
          if [ "${#PBKDF2_DIAGNOSTIC_TOKEN}" -lt 43 ]; then
            echo "PBKDF2_DIAGNOSTIC_TOKEN must contain at least 32 random bytes (43 base64url characters)."
            exit 1
          fi

          test -s scripts/pbkdf2-preview-diagnostic-worker.ts
          test -s wrangler.pbkdf2-preview.toml
          if grep -Eiq 'd1_databases|database_id|database_name|faneva-v2-staging-api|db0a27e3-898c-4116-8730-7bd1da0a1a10|faneva-v2-staging-db' wrangler.pbkdf2-preview.toml scripts/pbkdf2-preview-diagnostic-worker.ts; then
            echo "Forbidden staging/D1 reference found"
            exit 1
          fi
          test "$(grep -c '^name = "faneva-v2-pbkdf2-preview-diagnostic"$' wrangler.pbkdf2-preview.toml)" -eq 1
          grep -q 'crypto.subtle.importKey' scripts/pbkdf2-preview-diagnostic-worker.ts
          grep -q 'crypto.subtle.deriveBits' scripts/pbkdf2-preview-diagnostic-worker.ts
          echo "Isolated PBKDF2 deployment preflight: PASS"

      - name: Provision the dedicated PBKDF2 diagnostic bearer secret
        working-directory: backend/cloudflare-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PBKDF2_DIAGNOSTIC_TOKEN: ${{ secrets.PBKDF2_DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$PBKDF2_DIAGNOSTIC_TOKEN" | npx --yes wrangler@4 secret put DIAGNOSTIC_TOKEN --config wrangler.pbkdf2-preview.toml

      - name: Deploy only the dedicated PBKDF2 diagnostic Worker after secret provisioning
        working-directory: backend/cloudflare-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.pbkdf2-preview.toml
