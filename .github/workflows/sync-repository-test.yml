name: FANEVA V2 Sync Repository Test

on:
  workflow_dispatch:
  push:
    branches:
      - security/device-enrollment-current-head
      - implementation/device-identity-keystore
      - implementation/owner-bootstrap-30m
      - feature/authoritative-business-sync
      - fix/p1-push-response-completeness
      - fix/business-sync-v1-readiness

permissions:
  contents: read

concurrency:
  group: faneva-v2-sync-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-repository-test:
    name: Sync Repository Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36.1" \
                     "build-tools;36.0.0"

      - name: Run Sync Repository Test only
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest \
            --tests "com.example.SyncRepositoryTest" \
            --tests "com.example.ProtocolV1AdapterTest" \
            --tests "com.example.OutboxProtocolV1ContractTest"

      - name: Upload Sync Repository test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faneva-sync-repository-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
