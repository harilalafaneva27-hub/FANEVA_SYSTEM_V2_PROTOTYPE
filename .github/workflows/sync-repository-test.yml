name: FANEVA V2 Sync Repository Tests

on:
  workflow_dispatch:
  push:
    branches:
      - corrections/run3-baseline

permissions:
  contents: read

concurrency:
  group: faneva-v2-sync-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-repository-test:
    name: SyncRepositoryTest only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                       "platforms;android-36.1" \
                     "build-tools;36.0.0"

      - name: Run SyncRepositoryTest only
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest \
            --tests "com.example.SyncRepositoryTest"

      - name: Upload JUnit test reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: faneva-v2-sync-repository-junit-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
          retention-days: 7
