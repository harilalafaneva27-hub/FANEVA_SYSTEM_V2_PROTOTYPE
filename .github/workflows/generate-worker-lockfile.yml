name: Generate pinned Worker npm lockfile

on:
  pull_request:
    branches:
      - feature/product-edit-delete
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: faneva-v2-worker-lockfile-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'fix/staging-worker-deploy-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify this is the same-repository hardening branch
        shell: bash
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]]
          [[ "$PR_HEAD_REF" == "fix/staging-worker-deploy-hardening" ]]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate npm v3 lockfile and verify clean install and complete Worker test suite
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e 'const p=require("./package-lock.json"); if(p.lockfileVersion !== 3) process.exit(1); if(p.packages?.[""]?.name !== "faneva-v2-staging-device-auth") process.exit(2); if(p.packages?.["node_modules/@cloudflare/vitest-plugin"]?.version !== "1.9.2") process.exit(3); if(p.packages?.["node_modules/workerd"]?.version < "1.20261118.0") process.exit(4)'
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run test:business-d1
          python scripts/test-migrations.py
      - name: Commit only the generated lockfile to this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cloudflare-worker/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git diff --cached --name-only | grep -Fx 'backend/cloudflare-worker/package-lock.json'
          [[ "$(git diff --cached --name-only | wc -l | tr -d ' ')" == "1" ]]
          git commit -m "build(worker): refresh locked Cloudflare runtime"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${PR_HEAD_REF}"
