name: Generate pinned Worker npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faneva-v2-worker-lockfile-{ github.ref }
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restrict lockfile generation to the hardening branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "fix/staging-worker-deploy-hardening" ]] || {
            echo "This helper is restricted to the staging hardening branch." >&2
            exit 40
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate npm v3 lockfile and verify clean install
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e 'const p=require("./package-lock.json"); if(p.lockfileVersion !== 3) process.exit(1); if(p.packages?.[""]?.name !== "faneva-v2-staging-device-auth") process.exit(2)'
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          git -C "$GITHUB_WORKSPACE" diff --check
      - name: Commit only the generated lockfile to this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cloudflare-worker/package-lock.json
          if git diff --cached --quiet; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git diff --cached --name-only | grep -Fx 'backend/cloudflare-worker/package-lock.json'
          [[ "$(git diff --cached --name-only | wc -l | tr -d ' ')" == "1" ]]
          git commit -m "build(worker): add reproducible npm lockfile"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:fix/staging-worker-deploy-hardening"
