name: FANEVA V2 Isolated Argon2id Preview Deployment

run-name: Isolated Argon2id Preview deployment (manual, gated)

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Confirm deployment of the isolated diagnostic Worker only"
        required: true
        type: choice
        options:
          - NO_DEPLOY
          - DEPLOY_ISOLATED_PREVIEW

permissions:
  contents: read

concurrency:
  group: faneva-v2-argon2id-preview-deployment
  cancel-in-progress: false

jobs:
  deploy-isolated-preview:
    if: github.ref == 'refs/heads/feature/argon2id-preview-deployment-gated' && inputs.confirm_deployment == 'DEPLOY_ISOLATED_PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate isolated diagnostic target
        working-directory: backend/cloudflare-worker
        run: node scripts/validate-argon2id-preview-profile-setup.mjs

      - name: Stage pinned Argon2id loader and WASM assets
        working-directory: backend/cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/argon2id-preview-package"
          mkdir -p "$package_root"
          npm install --prefix "$package_root" --no-save --package-lock=false argon2id@1.0.1
          test -s "$package_root/node_modules/argon2id/lib/setup.js"
          test -s "$package_root/node_modules/argon2id/dist/simd.wasm"
          test -s "$package_root/node_modules/argon2id/dist/no-simd.wasm"
          ln -s "$package_root/node_modules" node_modules
          mkdir -p scripts
          cp "$package_root/node_modules/argon2id/dist/simd.wasm" scripts/argon2id-simd.wasm
          cp "$package_root/node_modules/argon2id/dist/no-simd.wasm" scripts/argon2id-no-simd.wasm
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const file of ["scripts/argon2id-simd.wasm", "scripts/argon2id-no-simd.wasm"]) {
              if (!readFileSync(file).subarray(0, 4).equals(Buffer.from([0, 97, 115, 109]))) {
                throw new Error("Invalid WASM binary: " + file);
              }
            }
          '

      - name: Deploy only the dedicated diagnostic Worker
        working-directory: backend/cloudflare-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s wrangler.argon2id-preview.toml
          ! grep -Eiq 'd1_databases|database_id|database_name' wrangler.argon2id-preview.toml
          test "$(grep -c '^name = "faneva-v2-argon2id-preview-diagnostic"$' wrangler.argon2id-preview.toml)" -eq 1
          npx --yes wrangler@4 deploy --config wrangler.argon2id-preview.toml

      - name: Provision the runtime diagnostic bearer secret
        working-directory: backend/cloudflare-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_TOKEN: ${{ secrets.DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DIAGNOSTIC_TOKEN"
          if [ "${#DIAGNOSTIC_TOKEN}" -lt 43 ]; then
            echo "DIAGNOSTIC_TOKEN must contain at least 32 random bytes (43 base64url characters)."
            exit 1
          fi
          printf '%s' "$DIAGNOSTIC_TOKEN" | npx --yes wrangler@4 secret put DIAGNOSTIC_TOKEN --config wrangler.argon2id-preview.toml
