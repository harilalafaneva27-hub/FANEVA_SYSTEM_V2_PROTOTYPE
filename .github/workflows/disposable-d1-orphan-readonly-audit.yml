name: FANEVA V2 Disposable D1 Read-Only Orphan Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faneva-v2-disposable-d1-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: disposable-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout immutable audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate audit script syntax
        working-directory: backend/cloudflare-worker
        run: node --check scripts/audit-disposable-d1-orphan-readonly.mjs
      - name: Verify protected credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Protected credentials are present."
      - name: Verify exact Disposable D1 identity and run SELECT-only audit
        working-directory: backend/cloudflare-worker
        run: node scripts/audit-disposable-d1-orphan-readonly.mjs
