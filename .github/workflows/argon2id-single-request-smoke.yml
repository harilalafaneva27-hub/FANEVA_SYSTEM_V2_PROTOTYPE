name: FANEVA V2 Isolated Argon2id Single-Request Preview Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm_smoke_test:
        description: "Explicitly authorize exactly one remote Argon2id derive request"
        required: true
        type: choice
        default: "NO_RUN"
        options:
          - "NO_RUN"
          - "RUN_ONE_DERIVE"

permissions:
  contents: read

concurrency:
  group: faneva-v2-argon2id-single-request-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    if: github.event.inputs.confirm_smoke_test == 'RUN_ONE_DERIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: disposable-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout immutable, CI-validated Argon2id diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2235cedab070fe239c377b44baa26089d961429c
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate isolated smoke-test inputs and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]
          test -s scripts/argon2id-single-request-smoke.mjs
          test -s scripts/argon2id-preview-response.mjs
          test -s scripts/argon2id-security-validation-worker.ts
          if grep -Eiq 'd1_databases|database_id|database_name|binding[[:space:]]*=[[:space:]]*"DB"' scripts/argon2id-single-request-smoke.mjs scripts/argon2id-security-validation-worker.ts; then
            echo "D1 configuration is forbidden in the isolated smoke test"
            exit 1
          fi
          node --check scripts/argon2id-single-request-smoke.mjs
          node --check scripts/argon2id-preview-response.mjs

      - name: Install pinned Argon2id package and stage its WASM binaries
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/argon2id-package"
          mkdir -p "$package_root"
          npm install --prefix "$package_root" --no-save --package-lock=false argon2id@1.0.1
          test -s "$package_root/node_modules/argon2id/package.json"
          test -s "$package_root/node_modules/argon2id/lib/setup.js"
          test -s "$package_root/node_modules/argon2id/dist/simd.wasm"
          test -s "$package_root/node_modules/argon2id/dist/no-simd.wasm"
          ln -s "$package_root/node_modules" node_modules
          cp node_modules/argon2id/dist/simd.wasm scripts/argon2id-simd.wasm
          cp node_modules/argon2id/dist/no-simd.wasm scripts/argon2id-no-simd.wasm
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const file of ["scripts/argon2id-simd.wasm", "scripts/argon2id-no-simd.wasm"]) {
              const magic = readFileSync(file).subarray(0, 4);
              if (!magic.equals(Buffer.from([0, 97, 115, 109]))) throw new Error("Invalid WASM header: " + file);
            }
            console.log("Argon2id package, loader and both WASM assets verified");
          '

      - name: Run exactly one Argon2id remote-preview derive request (no D1, no deploy)
        run: node scripts/argon2id-single-request-smoke.mjs
