name: FANEVA V2 Argon2id Timing Instrumentation Tests

on:
  push:
    branches:
      - audit/argon2id-timing-instrumentation
      - fix/argon2id-cloudflare-cpu-profiling
  pull_request:
    paths:
      - "backend/cloudflare-worker/scripts/argon2id-kdf-timing.mjs"
      - "backend/cloudflare-worker/scripts/argon2id-kdf-timing.test.mjs"
      - "backend/cloudflare-worker/scripts/argon2id-security-validation-worker.ts"
      - "backend/cloudflare-worker/scripts/argon2id-single-request-smoke.mjs"
      - "backend/cloudflare-worker/scripts/argon2id-preview-response.mjs"
      - "backend/cloudflare-worker/scripts/ARGON2ID-CLOUDFLARE-PROFILING.md"
      - ".github/workflows/argon2id-timing-instrumentation-tests.yml"

permissions:
  contents: read

concurrency:
  group: faneva-v2-argon2id-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check patch formatting
        run: git diff --check 79d96911e4ca0f14c4d191fd4dddd8d2c30d6e60 HEAD -- backend/cloudflare-worker/scripts/argon2id-kdf-timing.mjs backend/cloudflare-worker/scripts/argon2id-kdf-timing.test.mjs backend/cloudflare-worker/scripts/argon2id-security-validation-worker.ts backend/cloudflare-worker/scripts/argon2id-single-request-smoke.mjs backend/cloudflare-worker/scripts/argon2id-preview-response.mjs backend/cloudflare-worker/scripts/ARGON2ID-CLOUDFLARE-PROFILING.md .github/workflows/argon2id-timing-instrumentation-tests.yml
      - name: Verify deployed Worker does not use timer-based KDF measurements
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'performance\.now|Date\.now|measureSynchronousKdf|kdfElapsedMs' scripts/argon2id-security-validation-worker.ts
      - name: Syntax-check diagnostic scripts without executing remote requests
        run: |
          node --check scripts/argon2id-single-request-smoke.mjs
          node --check scripts/argon2id-preview-response.mjs
      - name: Run isolated timing semantics tests (no network, no Cloudflare)
        run: node --test scripts/argon2id-kdf-timing.test.mjs
