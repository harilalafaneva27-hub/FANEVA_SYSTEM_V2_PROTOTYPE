name: FANEVA V2 Apply staging D1 migration 0007 only

on:
  push:
    branches:
      - audit/staging-d1-migrate-0007
    paths:
      - "backend/cloudflare-worker/scripts/apply-staging-d1-migration-0007.sh"
      - ".github/workflows/staging-d1-migrate-0007.yml"

permissions:
  contents: read

concurrency:
  group: faneva-v2-staging-d1-migration-0007
  cancel-in-progress: false

jobs:
  apply-staging-migration:
    name: Apply exactly migration 0007 to verified V2 staging D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: faneva-v2-staging
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.FANEVA_V2_STAGING_ACCOUNT_ID }}
      FANEVA_V2_STAGING_D1_ID: ${{ vars.FANEVA_V2_STAGING_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration script syntax
        run: bash -n scripts/apply-staging-d1-migration-0007.sh
      - name: Apply and verify staging D1 migration only
        run: bash scripts/apply-staging-d1-migration-0007.sh
