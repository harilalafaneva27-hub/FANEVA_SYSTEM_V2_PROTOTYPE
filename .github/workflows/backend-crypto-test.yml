name: Backend Cryptographic Verification Tests

on:
  push:
    branches:
      - backend/staging-device-signature
      - implementation/owner-bootstrap-30m
      - feature/atomic-business-handlers
      - feature/protocol-v1-sync-repository
      - fix/sale-replay-vendeur-projection
      - fix/staging-sync-integration-contract
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/backend-crypto-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/backend-crypto-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-crypto:
    name: TypeScript checks and ECDSA protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: SQLite migration invariants
        run: python scripts/test_business_migration.py
      - name: Sync pull watermark and vendor projection contracts
        run: python scripts/test_sync_pull_contract.py
      - name: Atomic multi-line SALE rollback integration test
        run: python scripts/test_atomic_sale_rollback.py
      - name: Atomic TRANSFER and DEBT_PAYMENT integration tests
        run: python scripts/test_atomic_transfer_debt.py
      - name: Cryptographic protocol tests
        run: npm test
