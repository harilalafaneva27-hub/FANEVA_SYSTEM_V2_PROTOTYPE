name: Backend Cryptographic Verification Tests

on:
  push:
    branches:
      - backend/staging-device-signature
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/backend-crypto-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/backend-crypto-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-crypto:
    name: TypeScript checks and ECDSA protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Cryptographic protocol tests
        run: npm test
