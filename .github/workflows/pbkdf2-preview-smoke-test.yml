name: FANEVA V2 Isolated PBKDF2 Preview Smoke Test

run-name: PBKDF2 diagnostic runtime smoke test (manual, read-only)

on:
  pull_request:
    branches:
      - feature/product-edit-delete
    paths:
      - ".github/workflows/pbkdf2-preview-smoke-test.yml"
  workflow_dispatch:
    inputs:
      version_id:
        description: "Deployed diagnostic Worker Version ID"
        required: true
        type: string
        default: "73805d72-8029-4494-9401-917abacea97a"

permissions:
  contents: read

concurrency:
  group: faneva-v2-pbkdf2-preview-smoke-test
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/pbkdf2-preview-smoke-test.yml

  smoke-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pbkdf2-preview-smoke-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs and required secrets
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PBKDF2_DIAGNOSTIC_TOKEN: ${{ secrets.PBKDF2_DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PBKDF2_DIAGNOSTIC_TOKEN"
          if [ "${#PBKDF2_DIAGNOSTIC_TOKEN}" -lt 43 ]; then
            echo "::error::PBKDF2_DIAGNOSTIC_TOKEN must contain at least 32 random bytes."
            exit 1
          fi
          echo "Input and secret presence checks: PASS"

      - name: Resolve exact Cloudflare Version URL (GET only)
        id: resolve
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WORKER="faneva-v2-pbkdf2-preview-diagnostic"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain_file="$(mktemp)"
          account_subdomain_file="$(mktemp)"
          version_file="$(mktemp)"
          trap 'rm -f "$subdomain_file" "$account_subdomain_file" "$version_file"' EXIT

          # Script-level endpoint reports whether Preview URLs are enabled.
          subdomain_status="$(curl --silent --show-error --output "$subdomain_file" --write-out '%{http_code}' \\
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            "$API/workers/scripts/$WORKER/subdomain")"
          if [ "$subdomain_status" != "200" ] || [ "$(jq -r '.success' "$subdomain_file")" != "true" ]; then
            echo "::error::Cloudflare Worker subdomain GET failed (HTTP $subdomain_status)."
            exit 1
          fi

          previews_enabled="$(jq -r '.result.previews_enabled // false' "$subdomain_file")"
          if [ "$previews_enabled" != "true" ]; then
            echo "::error::Cloudflare Preview URLs are not enabled for this Worker. No configuration was changed."
            exit 1
          fi

          # Account-level endpoint supplies the workers.dev subdomain used by Version URLs.
          account_subdomain_status="$(curl --silent --show-error --output "$account_subdomain_file" --write-out '%{http_code}' \\
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            "$API/workers/subdomain")"
          if [ "$account_subdomain_status" != "200" ] || [ "$(jq -r '.success' "$account_subdomain_file")" != "true" ]; then
            echo "::error::Cloudflare account workers.dev subdomain GET failed (HTTP $account_subdomain_status)."
            exit 1
          fi

          account_subdomain="$(jq -r '.result.subdomain // empty' "$account_subdomain_file")"
          if [[ ! "$account_subdomain" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::Cloudflare returned an invalid or unavailable account workers.dev subdomain."
            exit 1
          fi
          suffix="${account_subdomain}.workers.dev"

          version_status="$(curl --silent --show-error --output "$version_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/workers/scripts/$WORKER/versions/$VERSION_ID")"
          if [ "$version_status" != "200" ] || [ "$(jq -r '.success' "$version_file")" != "true" ]; then
            echo "::error::Cloudflare exact script-version GET failed (HTTP $version_status)."
            exit 1
          fi

          returned_id="$(jq -r '.result.id // empty' "$version_file")"
          if [ "$returned_id" != "$VERSION_ID" ]; then
            echo "::error::Cloudflare returned a different Version ID."
            exit 1
          fi

          # Cloudflare documents Version URLs as <version-prefix>-<worker>.<account-subdomain>.workers.dev.
          version_prefix="${VERSION_ID:0:8}"
          url="https://${version_prefix}-${WORKER}.${suffix}"
          echo "version_url=$url" >> "$GITHUB_OUTPUT"
          echo "Cloudflare read-only identity checks: PASS"
          echo "Worker: $WORKER"
          echo "Version ID: $VERSION_ID"
          echo "Version URL constructed from the verified Version ID and account workers.dev subdomain."

      - name: Authenticated GET /health
        shell: bash
        env:
          VERSION_URL: ${{ steps.resolve.outputs.version_url }}
          PBKDF2_DIAGNOSTIC_TOKEN: ${{ secrets.PBKDF2_DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --request GET \
            --header "Authorization: Bearer $PBKDF2_DIAGNOSTIC_TOKEN" \
            --header "Accept: application/json" \
            "$VERSION_URL/health")"
          printf '%s' "$response" | jq -e '
            .ok == true and
            .diagnostic == "PBKDF2" and
            .d1Configured == false and
            .kdfExecuted == false
          ' >/dev/null
          echo "Authenticated /health: PASS (PBKDF2 diagnostic; D1 absent; KDF not yet run)"

      - name: Authenticated POST /run (empty body)
        shell: bash
        env:
          VERSION_URL: ${{ steps.resolve.outputs.version_url }}
          PBKDF2_DIAGNOSTIC_TOKEN: ${{ secrets.PBKDF2_DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $PBKDF2_DIAGNOSTIC_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Length: 0" \
            "$VERSION_URL/run")"
          if [ "$status" != "200" ]; then
            echo "::error::PBKDF2 /run returned HTTP $status."
            jq '{ok, stage, importKey, results, d1Configured, passwordOrSaltReturned, timingAvailable}' "$response_file" || true
            exit 1
          fi

          jq -e '
            .ok == true and
            .stage == "PBKDF2_DIAGNOSTIC_PASS" and
            .importKey == "PASS" and
            .d1Configured == false and
            .passwordOrSaltReturned == false and
            ([.results[].iterations] == [1000, 10000, 100000, 310000]) and
            all(.results[]; .ok == true and .stage == "DERIVE_PASS")
          ' "$response_file" >/dev/null

          echo "PBKDF2 runtime result:"
          jq '{ok, stage, importKey, results, d1Configured, passwordOrSaltReturned, timingAvailable}' "$response_file"
          echo "PBKDF2 Cloudflare runtime smoke test: PASS"
