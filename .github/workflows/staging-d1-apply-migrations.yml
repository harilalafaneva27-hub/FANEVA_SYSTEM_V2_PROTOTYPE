name: FANEVA V2 Apply Staging D1 Migrations (Protected)

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Run ID of the encrypted staging D1 backup artifact"
        required: true
        type: string
        default: "45603544658"
      confirmation:
        description: "Type APPLY_FANEVA_V2_STAGING_MIGRATIONS exactly"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: faneva-v2-staging-d1-migrations
  cancel-in-progress: false

jobs:
  apply-migrations:
    name: Verify backup and apply migrations 0001-0006 to approved staging D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: faneva-v2-staging
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.FANEVA_V2_STAGING_ACCOUNT_ID }}
      FANEVA_V2_STAGING_D1_ID: ${{ vars.FANEVA_V2_STAGING_D1_ID }}
      FANEVA_V2_BACKUP_PASSPHRASE: ${{ secrets.FANEVA_V2_BACKUP_PASSPHRASE }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backup verification tools and Wrangler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg
          npm install --global wrangler@4

      - name: Require explicit migration confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "APPLY_FANEVA_V2_STAGING_MIGRATIONS" ]] || {
            echo "Explicit migration confirmation did not match; stopping before any D1 write." >&2
            exit 20
          }
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]{8,20}$ ]] || {
            echo "Backup run ID must be numeric." >&2
            exit 21
          }
          [[ "$FANEVA_V2_STAGING_D1_ID" == "db0a27e3-898c-4116-8730-7bd1da0a1a10" ]] || {
            echo "Staging D1 UUID mismatch; stopping." >&2
            exit 22
          }
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare API token}"
          : "${FANEVA_V2_BACKUP_PASSPHRASE:?Missing protected backup passphrase}"

      - name: Download the selected encrypted backup artifact
        uses: actions/download-artifact@v4
        with:
          name: faneva-v2-staging-d1-encrypted-backup-${{ inputs.backup_run_id }}
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/faneva-v2-backup-artifact

      - name: Verify backup identity, checksum and AES256 decryption
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/faneva-v2-backup-artifact"
          passphrase_file="$RUNNER_TEMP/faneva-v2-backup-passphrase"
          decrypted_file="$RUNNER_TEMP/faneva-v2-backup-verify.sql"
          umask 077
          printf '%s' "$FANEVA_V2_BACKUP_PASSPHRASE" > "$passphrase_file"

          expected_files="$(printf '%s\\n' 'faneva-v2-staging-db.sql.gpg' 'IDENTITY.txt' 'SHA256SUMS' | sort)"
          actual_files="$(find "$backup_dir" -maxdepth 1 -type f -printf '%f\\n' | sort)"
          [[ "$actual_files" == "$expected_files" ]] || {
            echo "Backup artifact contents are not the exact encrypted-only file set." >&2
            exit 23
          }
          grep -Fxq "D1_BACKUP_NAME=faneva-v2-staging-db" "$backup_dir/IDENTITY.txt"
          grep -Fxq "D1_BACKUP_ID=$FANEVA_V2_STAGING_D1_ID" "$backup_dir/IDENTITY.txt"
          grep -Fxq "ENCRYPTION=GPG_AES256" "$backup_dir/IDENTITY.txt"
          (cd "$backup_dir" && sha256sum --check SHA256SUMS)

          gpg --batch --yes --no-tty --pinentry-mode loopback \\
            --passphrase-file "$passphrase_file" \\
            --decrypt --output "$decrypted_file" "$backup_dir/faneva-v2-staging-db.sql.gpg"
          test -s "$decrypted_file"
          echo "ENCRYPTED_BACKUP_IDENTITY_CHECKSUM_AND_DECRYPTION=PASS"

      - name: Re-verify exact staging D1 identity and live Worker DB binding
        run: |
          bash -n scripts/staging-d1-readonly-preflight.sh
          bash scripts/staging-d1-readonly-preflight.sh

      - name: Verify exactly six reviewed migration files are present
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\\n' \
            0001_device_registry.sql \
            0002_owner_bootstrap_sessions.sql \
            0003_authoritative_business_ledger.sql \
            0004_auth_credential_hardening.sql \
            0005_store_attributed_customer_ledger.sql \
            0006_security_audit_chain.sql | sort)"
          actual="$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\\n' | sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "Migration directory differs from the reviewed 0001-0006 set." >&2
            exit 24
          }
          python scripts/test-migrations.py

      - name: Show current remote migration state
        run: wrangler d1 migrations list faneva-v2-staging-db --remote --config wrangler.toml

      - name: Apply pending migrations to the approved staging D1
        run: wrangler d1 migrations apply faneva-v2-staging-db --remote --config wrangler.toml

      - name: Verify all six migration records and required schema
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            -H "Content-Type: application/json" \\
            "$api/d1/database/$FANEVA_V2_STAGING_D1_ID/query" \\
            --data '{"sql":"SELECT name FROM d1_migrations ORDER BY name"}' \\
            -o "$RUNNER_TEMP/migrations.json"
          jq -e '
            .success == true and .result[0].success == true and
            ([.result[0].results[].name | sub("\\\\.sql$"; "")] | sort) ==
            ["0001_device_registry","0002_owner_bootstrap_sessions","0003_authoritative_business_ledger","0004_auth_credential_hardening","0005_store_attributed_customer_ledger","0006_security_audit_chain"]
          ' "$RUNNER_TEMP/migrations.json" >/dev/null

          curl --fail --silent --show-error \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            -H "Content-Type: application/json" \\
            "$api/d1/database/$FANEVA_V2_STAGING_D1_ID/query" \\
            --data '{"sql":"SELECT name FROM sqlite_master WHERE type IN (\\u0027table\\u0027,\\u0027view\\u0027)"}' \\
            -o "$RUNNER_TEMP/schema.json"
          jq -e '
            .success == true and .result[0].success == true and
            ([.result[0].results[].name] as $names |
              all(["device_registry","owner_bootstrap","auth_principals","auth_sessions","auth_store_grants","sync_mutations","sync_events","sync_entity_versions","business_products","business_customers","business_stock","business_sales","business_sale_lines","business_customer_ledger","business_debt_payments","business_transfers","business_stock_movements","business_customer_balances","security_audit_head","security_audit_events"][];
                . as $required | $names | index($required) != null))
          ' "$RUNNER_TEMP/schema.json" >/dev/null

          curl --fail --silent --show-error \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            -H "Content-Type: application/json" \\
            "$api/d1/database/$FANEVA_V2_STAGING_D1_ID/query" \\
            --data '{"sql":"SELECT COUNT(*) AS active_admins FROM auth_principals WHERE role=\\u0027ADMIN\\u0027 AND status=\\u0027ACTIVE\\u0027"}' \\
            -o "$RUNNER_TEMP/admin-count.json"
          jq -e '.success == true and .result[0].success == true and .result[0].results[0].active_admins == 0' "$RUNNER_TEMP/admin-count.json" >/dev/null
          echo "STAGING_D1_MIGRATIONS_0001_TO_0006_AND_SCHEMA_VERIFICATION=PASS"
          echo "ACTIVE_ADMIN_COUNT=0 (awaiting separately issued one-time owner bootstrap code)"

      - name: Cleanup decrypted backup and temporary secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/faneva-v2-backup-passphrase" "$RUNNER_TEMP/faneva-v2-backup-verify.sql"
          rm -f "$RUNNER_TEMP/migrations.json" "$RUNNER_TEMP/schema.json" "$RUNNER_TEMP/admin-count.json"
          rm -rf "$RUNNER_TEMP/faneva-v2-backup-artifact"
